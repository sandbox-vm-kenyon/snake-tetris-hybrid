<!-- Snake-Tetris Hybrid -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Testrisss - Core Engine</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="game-container">
        <div id="game-layout">
            <canvas id="tetris" width="240" height="400"></canvas>
            <div id="side-panel">
                <div id="next-piece-label">Next:</div>
                <canvas id="next-piece" width="100" height="100"></canvas>
                <div id="score">Score: 0</div>
            </div>
        </div>
    </div>
    </div>
    <div id="pc-instructions">PC: Arrow Keys to Move, D/F to Rotate</div>
    <div id="controls">
        <div class="d-pad">
            <div class="d-pad-row">
                <button id="up" class="d-pad-btn">Up</button>
            </div>
            <div class="d-pad-row">
                <button id="left" class="d-pad-btn">Left</button>
                <button id="down" class="d-pad-btn">Down</button>
                <button id="right" class="d-pad-btn">Right</button>
            </div>
        </div>
        <div class="rotate-buttons">
            <button id="rotate-left">Rotate Left</button>
            <button id="rotate-right">Rotate Right</button>
        </div>
    </div>
    <script src="game.js"></script>
</body>
</html>
