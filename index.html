<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Testrisss - Core Engine</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="game-container">
        <canvas id="tetris" width="240" height="400"></canvas>
        <div id="score">Score: 0</div>
    </div>
    <div id="controls">
        <div class="d-pad">
            <button id="up" class="d-pad-up">Up</button>
            <div class="d-pad-mid">
                <button id="left" class="d-pad-left">Left</button>
                <button id="down" class="d-pad-down">Down</button>
                <button id="right" class="d-pad-right">Right</button>
            </div>
        </div>
        <button id="rotate">Rotate</button>
    </div>
    <script src="game.js"></script>
</body>
</html>
